<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>10DEC - FDR</title>
<link rel="manifest" href="manifest.json?v=2"><meta name="theme-color" content="#ffd93d"><link rel="icon" href="icon-192.png?v=2"><link rel="apple-touch-icon" href="icon-192.png?v=2"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="10DEC - FDR"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{--bg:#fffaf5;--card:#fff;--fg:#1d2033;--muted:#646a85;--line:#f0e6df;--hero:linear-gradient(160deg,#fde2b0 0%,#f9c2b4 50%,#cdd1f3 100%);--hero-fg:#1d2033;--hero-acc:#b3311f;
--ok:#1f9d57;--ok-soft:#dcf5e6;--todo:#9b1c3c;--todo-soft:#f8dde3;--chk:#7246d6;--chk-soft:#e9e1fb;--blue:#1877d2;--blue-soft:#dbeafc;--sun:#e8890c;--sun-soft:#fdebd0;--lock:#8a8fa8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--card:#1f2230;--fg:#eef0f7;--muted:#a3a8c0;--line:#30344a;--ok-soft:#173b29;--todo-soft:#43202b;--chk-soft:#2e2550;--blue-soft:#1b2d48;--sun-soft:#41301a}}
:root[data-theme="dark"]{--bg:#14161f;--card:#1f2230;--fg:#eef0f7;--muted:#a3a8c0;--line:#30344a;--ok-soft:#173b29;--todo-soft:#43202b;--chk-soft:#2e2550;--blue-soft:#1b2d48;--sun-soft:#41301a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}
.top{background:var(--hero);color:var(--hero-fg);padding:22px 18px 20px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;gap:10px}
.top h1{font-size:28px;line-height:1.1}
.top .hi{font-size:18px;opacity:.95}
.login{display:flex;flex-direction:column;gap:8px}
.pin{width:100%;border:2px solid #e2e4ee;border-radius:12px;padding:11px 12px;font:inherit;font-size:17px;background:#fff;color:#1d2033;margin:4px 0 10px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.login label{font-weight:700}
.login .row{display:flex;gap:8px}
.login input{flex:1;min-width:0;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-size:18px;background:#fff;color:#1d2033}
.login button{border:0;border-radius:12px;padding:0 18px;background:var(--sun);color:#fff;font-weight:700}
.err{color:#b3311f;font-weight:700;min-height:1.2em}
.small-btn{background:rgba(255,255,255,.6);border:0;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;color:#1d2033;align-self:flex-start}
.month{font-family:"Fredoka";font-weight:600;font-size:19px;margin:22px 16px 8px;color:var(--muted);text-transform:capitalize}
.ev{display:flex;gap:12px;align-items:center;margin:8px 14px;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 4px 14px rgba(29,32,51,.06);border:0;width:calc(100% - 28px);text-align:left}
.ev.mine{outline:3px solid var(--ok)}
.ev .d{flex:none;width:58px;text-align:center;background:var(--bg);border-radius:12px;padding:6px 0}
.ev .d b{display:block;font-family:"Fredoka";font-size:26px;line-height:1}
.ev .d span{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase}
.ev .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ev .t{font-family:"Fredoka";font-weight:600;font-size:19px;line-height:1.15}
.ev .v{color:var(--muted);font-size:15px}
.ev.locked .t{color:var(--lock)}
.tb{display:inline-block;background:#1d2033;color:#fff;border-radius:6px;padding:0 6px;font-size:13px;font-family:"Atkinson Hyperlegible";vertical-align:middle;letter-spacing:.05em}
.faces{display:flex;flex-wrap:wrap;gap:5px}
.nm{background:var(--bg);border-radius:999px;padding:2px 10px;font-weight:700;font-size:14.5px}
.nm.me{background:var(--ok-soft);color:var(--ok)}
.face{width:34px;height:34px;border-radius:50%;border:2px solid var(--card);margin-left:-8px;background:#c9cde0;display:grid;place-items:center;font-weight:700;font-size:13px;color:#1d2033;overflow:hidden;flex:none}
.face:first-child{margin-left:0}
.face img{width:100%;height:100%;object-fit:cover}
.tag{align-self:flex-start;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13.5px;background:var(--ok-soft);color:var(--ok)}
.empty{margin:30px 18px;color:var(--muted)}
.memo-btn{display:block;margin:18px 14px 0;width:calc(100% - 28px);border:0;border-radius:16px;padding:14px;background:var(--blue-soft);color:var(--blue);font-weight:700;font-size:17px}
/* sheet */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;-webkit-overflow-scrolling:touch}
.hero{background:var(--hero);color:var(--hero-fg);padding:16px 18px 18px;border-radius:0 0 24px 24px;display:flex;flex-direction:column;gap:6px}
.back{background:rgba(255,255,255,.6);border:0;border-radius:999px;padding:6px 14px;font-weight:700;color:#1d2033;align-self:flex-start;font-size:15px}

.team{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

.sec{margin:12px 14px 0;background:var(--card);border-radius:18px;padding:14px;box-shadow:0 4px 14px rgba(29,32,51,.06);display:flex;flex-direction:column;gap:10px;scroll-margin-top:60px}

.who{font-family:"Fredoka";font-size:19px;font-weight:600;margin-top:4px}
.leg{border:3px solid var(--ok);border-radius:14px;overflow:hidden}
.leg.a_faire{border-color:var(--todo)}.leg.a_verifier{border-color:var(--chk)}.leg.orga{border-color:var(--blue)}

.leg-top .k{font-family:"Fredoka";font-weight:600;font-size:16px}
.badge{border-radius:999px;padding:2px 10px;font-weight:700;font-size:13.5px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-a_faire{background:var(--todo-soft);color:var(--todo)}.b-a_verifier{background:var(--chk-soft);color:var(--chk)}.b-orga{background:var(--blue-soft);color:var(--blue)}
.leg-body{padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px}
.big{font-family:"Fredoka";font-weight:700;font-size:28px;line-height:1.1}
.route{font-weight:700;font-size:18px}
.det{color:var(--muted);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:11px;font-weight:700;font-size:16px;margin-top:6px;text-decoration:none;width:100%}
.miss{margin-top:6px;border:2px dashed var(--chk);color:var(--chk);border-radius:12px;padding:9px;text-align:center;font-weight:700}
.btn.light{background:var(--blue-soft);color:var(--blue)}
.btn:disabled{opacity:.6}
.kv b{display:block;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.contact:last-child{border-bottom:0}
.contact b{display:block}.contact small{color:var(--muted)}
.tel{display:block;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:700;white-space:nowrap;text-decoration:none;font-size:16px;user-select:all;-webkit-user-select:all}
.tels{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.code{background:var(--sun-soft);color:var(--fg);border-radius:6px;padding:0 6px;font-size:1.1em;letter-spacing:.04em}
.hint{background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:8px 10px;font-size:15px}
.tlink{color:var(--ok);font-weight:700;white-space:nowrap}
.it{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.it:first-of-type{border-top:0}
.it .ic{font-size:22px;line-height:1.2;flex:none;width:28px;text-align:center}
.itb{display:block;font-family:"Fredoka";font-weight:600;font-size:17px;color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:16px}
th{text-align:left;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-family:"Fredoka";font-weight:700;color:var(--muted);width:28px}
td.t{font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-weight:700;font-size:13.5px;background:var(--chk-soft);color:var(--chk)}
.pq{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.lyr{font-size:14px;color:var(--blue);font-weight:700;white-space:nowrap;text-decoration:none}
.lsf{display:inline-block;margin:2px 0;padding:4px 10px;border-radius:999px;background:#ff9f95;color:#1d2033;font-size:13px;font-weight:800;white-space:nowrap;text-decoration:none}.lsfq{display:block;font-size:11px;opacity:.75;white-space:nowrap}.lsfc{text-align:right}.slk{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}.slk a{padding:8px 14px;border-radius:999px;background:#ff9f95;color:#1d2033;font-weight:800;font-size:14px;text-decoration:none}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{font-weight:700;font-size:17px;cursor:pointer;list-style:none}
.pers{border-top:2px solid var(--line);border:2px solid var(--line);border-radius:14px;padding:0;margin:0}
.pers+.pers{margin-top:8px}
.pers>summary{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-family:"Fredoka";font-size:19px}
.pers>summary::before{content:"▸";color:var(--muted);margin-right:8px}
.pers[open]>summary::before{content:"▾"}
.pers .pn{flex:1}
.pbody{display:flex;flex-direction:column;gap:10px;padding:0 10px 12px}
.num{user-select:text;-webkit-user-select:text}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--muted)}
details[open] summary::before{content:"▾ "}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--bg);color:var(--fg)}
.note{color:var(--muted);font-size:15px}
.rem{background:var(--bg);border-radius:12px;padding:10px 12px}
.rem small{color:var(--muted);display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:90vw}
.lockmsg{margin:40px 20px;text-align:center;font-size:19px}

.cat{margin:10px 14px 0;border-radius:18px;overflow:hidden;background:transparent;scroll-margin-top:60px}.cat[open]{background:var(--s)}
.cat>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;color:var(--c);background:var(--s);border:3px solid var(--b,var(--s));border-radius:18px;cursor:pointer}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary::before{content:none!important}
.cat>summary .e{font-size:26px;line-height:1}.cat>summary .t{flex:1;min-width:0}
.cat>summary .t b{display:block;font-family:"Fredoka";font-weight:600;font-size:19px}
.cat>summary .t small{display:block;opacity:.93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat>summary .ch{font-size:24px;transition:transform .2s}.cat[open]>summary .ch{transform:rotate(90deg)}
.cbody{background:var(--card);margin:0 6px 6px;border-radius:0 0 14px 14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rtag{display:inline-block;font-size:.8em;font-weight:700;color:var(--c);background:var(--s);border-radius:99px;padding:1px 9px;margin:2px 0 4px}
.journee h2{font-size:24px}
.jleg{display:flex;gap:6px;flex-wrap:wrap}.jleg span{border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.jleg .jt{background:#2e3bb2;color:#fff}.jleg .jp{background:#f7a42b;color:#1d2033}.jleg .ji{background:#87cabe;color:#1d2033}
.jday{display:flex;align-items:center;gap:8px;margin:4px 2px 0;font-family:"Fredoka";font-weight:600;font-size:16px;color:var(--muted)}.jday:after{content:"";flex:1;border-top:2px dashed var(--line)}
.jrow{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:10px;border-radius:16px;padding:12px;color:#1d2033}
.jrow.kt{background:#e3e5f7}.jrow.kp{background:#fde7c2}.jrow.ki{background:#dff2ee}.jrow.kp.star{background:#f7a42b}
.jh{font-family:"Fredoka";font-weight:700;font-size:21px;line-height:1.15}.kt .jh,.kt .jtag{color:#2e3bb2}.kp .jh,.kp .jtag{color:#7a4700}.ki .jh,.ki .jtag{color:#1f5a50}.kp.star .jh,.kp.star .jtag{color:#1d2033}
.jtag{font-size:12.5px;font-weight:700;letter-spacing:.04em}.jti{font-weight:700}.star .jti{font-size:20px}.js{font-size:15.5px}
.jrow .btn{margin-top:6px}.jrow a.btn.light{background:#fff;color:#2e3bb2}
.jb{display:inline-block;margin-top:6px;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;text-decoration:none;background:#fff;color:#2e3bb2;cursor:pointer}.jb.dark{background:#2e3bb2;color:#fff}
.jw{margin-top:6px;font-size:14px;font-weight:700;color:#7a4700}
.jprat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}.jprat .jb{margin:0;text-align:center;padding:12px 8px;background:var(--bg);color:var(--fg);font-size:16px}.jprat .jb small{display:block;font-weight:400;font-size:14px;color:var(--muted)}.jprat .jb.call{background:#1f6b5e;color:#fff}.jprat .jb.call small{color:#e6f4f1}
.dchips{display:flex;gap:6px}.dchips button{flex:1;border:0;border-radius:999px;padding:7px 4px;font-weight:700;font-size:14.5px;white-space:nowrap;background:var(--bg);color:var(--fg)}.dchips button.j{background:#f9c2b4;color:#1d2033}
.dcard{border-radius:20px;overflow:hidden;background:var(--card);border:2px solid var(--line);scroll-margin-top:60px}.dcard.j{border:3px solid #cdd1f3}
.dhead{background:#f1f2fc;color:#2e3bb2;padding:9px 14px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.dcard.j .dhead{background:#dfe2f8}
.dhead h3{margin:0;font-family:"Fredoka";font-weight:600;font-size:20px}.dhead small{font-weight:700;font-size:13.5px;color:#2e3bb2}
.dbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.dlab{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}.dlab.gv{color:#4b57d6}.dlab.gs{color:#b06a00}.dlab.gd{color:#2a8a78}
.drow{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:10px}.dh{font-family:"Fredoka";font-weight:700;font-size:19px;line-height:1.2}
.drow.star{background:#fbd3c8;color:#1d2033;border-radius:12px;padding:8px 10px;margin:0 -10px}.drow.star .jti{font-size:19px}
.dtag{font-size:13px;font-weight:700;color:#2a8a78}.dmut{color:var(--muted)}
.dnuit{background:#dff2ee;color:#1d2033;border-radius:14px;padding:10px 12px}.dnuit .jb{background:#fff}
.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.dgrp{border-radius:14px;background:var(--gb)}.dgrp.gv{--gb:#f1f2fc;--gc:#2e3bb2}.dgrp.gs{--gb:#fef1ec;--gc:#b3311f}.dgrp.gd{--gb:#eef7f4;--gc:#1f6b5e}
.dgrp>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:10px 12px;cursor:pointer;color:var(--gc)}.dgrp>summary::-webkit-details-marker{display:none}.dgrp>summary::before{content:none!important}
.dgrp .dl{font-family:"Fredoka";font-weight:600;font-size:17px}.dgrp .dhint{grid-column:1;font-size:14.5px;color:#1d2033;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dgrp[open] .dhint{display:none}
.dgrp .ch{grid-column:2;grid-row:1/3;align-self:center;font-size:22px;transition:transform .2s}.dgrp[open] .ch{transform:rotate(90deg)}
.dgb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px;color:#1d2033}.dgrp .dnuit{background:#fff}.dgrp .drow.star{margin:0 -4px}

.tile .e{font-size:26px;line-height:1}.tile b{font-family:"Fredoka";font-weight:600;font-size:19px;margin-top:4px}.tile small{font-size:13.5px;opacity:.9}.tile.on{outline:3px solid #cdd1f3;outline-offset:2px}
.t-contacts{--tg:#fde8e2;--tb:#f6b8a8;--tf:#1d2033}.t-setlist{--tg:#e6e8fa;--tb:#c3c8f0;--tf:#1d2033}.t-tenue{--tg:#fff;--tb:#fbd38d;--tf:#1d2033}.t-infos{--tg:#e3f3ef;--tb:#b6dfd5;--tf:#1d2033}
.t-repas{--tg:#2f3cff;--tb:#1a24b8;--tf:#fff;box-shadow:0 6px 16px -8px rgba(47,60,255,.7)}.t-repas small{color:#ffc629!important;font-weight:800;font-size:14px}

.tpan:not([open]){display:none}.tpan .cbody{margin:0;border-radius:0}
.k-run{--c:#1877d2;--s:#dbeafc}.k-dodo{--c:#7246d6;--s:#e9e1fb}.k-cont{--c:#0f8a8a;--s:#d3f1ef}.k-acc{--c:#9a4a12;--s:#fdeedd;--b:#fbd38d}.k-set{--c:#c2187a;--s:#fbdcee}.k-ten{--c:#4a5a9a;--s:#e1e5f4}.k-inf{--c:#5b6478;--s:#e8eaf1}
.cbody .itb{color:var(--c)}

.ev{border-left:10px solid var(--cc,transparent)}
.cat-interpretation{--cc:#4a4f63;--cs:#e3e5ec}.cat-ateliers{--cc:#a1776a;--cs:#f0e3de}.cat-festivals{--cc:#e6c94a;--cs:#fbf3c9}.cat-prod{--cc:#6d8ce8;--cs:#e0e8fb}.cat-projets{--cc:#7cc8d4;--cs:#ddf3f6}.cat-salles{--cc:#e397b6;--cs:#fae3ec}.cat-tb{--cc:#a58cf0;--cs:#ece6fd}

async function imp(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])}
async function dec(key,bytes){try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes.slice(0,12)},key,bytes.slice(12)))}catch(e){return null}}
async function derive(code){
  const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},base,256));
}
async function unlockWith(raw,isAdmin){
  const k=await imp(raw);let who=null;
  if(!isAdmin){for(const p of DATA.persons){const r=await dec(k,b64d(p));if(r){who=JSON.parse(td.decode(r));break}}if(!who)return false;st.me=who;st.pk=k;st.pkRaw=raw;
    if(who.adm){const a=await dec(k,b64d(who.adm));if(a)await unlockWith(a,true)}}
  else{st.admin=true;st.ak=k}
  if(!st.tk)for(const w of DATA.team.wraps){const r=await dec(k,b64d(w));if(r){const tk=await imp(r);st.tk=tk;st.memo=JSON.parse(td.decode(await dec(tk,b64d(DATA.team.data))));NOMS=JSON.parse(td.decode(await dec(tk,b64d(DATA.team.noms))));break}}
  for(const e of DATA.events){if(e.id)continue;let r=st.tk?await dec(st.tk,b64d(e.h)):null;if(!r&&isAdmin)r=await dec(k,b64d(e.h));if(r)Object.assign(e,JSON.parse(td.decode(r)))}
  for(const e of DATA.events){if(!e.id||st.ev[e.id])continue;for(const w of e.wraps){const r=await dec(k,b64d(w));if(r){const ek=await imp(r);st.keys[e.id]=ek;st.ev[e.id]=JSON.parse(td.decode(await dec(ek,b64d(e.data))));break}}}
  /* Régime et tailles : la personne lit seulement la sienne, Aurélie et Périnne lisent tout. */
  for(const e of DATA.events){if(!e.id)continue;
    if(!isAdmin&&e.pf&&!st.pf[e.id])for(const x of e.pf){const r=await dec(k,b64d(x));if(r){const o=JSON.parse(td.decode(r));if(o.ev===e.id){st.pf[e.id]=o;break}}}
    if(isAdmin&&e.pa&&!st.pa[e.id]){const r=await dec(k,b64d(e.pa));if(r)st.pa[e.id]=JSON.parse(td.decode(r))}}
  return true;
}

      sum="À compléter";

  }
  if(st.admin){
    const all=st.pa[id]||{};
    h+=`${inTeam?"<hr>":""}<div class="note">Vue admin · toute l'équipe de la date.</div><table><thead><tr><th>Nom</th><th>Régime</th><th>Haut</th><th>Bas</th></tr></thead><tbody>${team.map(s=>{const v=all[s];return `<tr><td>${esc(NOMS[s]||s)}</td><td>${v?esc(v.regime||"—"):"<i>pas encore</i>"}</td><td>${v?esc(v.haut||"—"):""}</td><td>${v?esc(v.bas||"—"):""}</td></tr>`}).join("")}</tbody></table>`;
    if(!inTeam){const n=team.filter(s=>all[s]).length;sum=n+"/"+team.length}
  }
  return {html:h,sum};
}
async function sendProf(id){
  const v={regime:document.getElementById("pr-reg").value.trim(),haut:document.getElementById("pr-haut").value,bas:document.getElementById("pr-bas").value.trim()};
  if(!v.regime&&!v.haut&&!v.bas){toast("Remplis au moins une case 🙂");return}
  if(!v.regime)v.regime="Aucun";
  const pt="profil:"+st.me.slug,texte=JSON.stringify(v);
  const hk=await crypto.subtle.importKey("raw",st.pkRaw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const sg=[...new Uint8Array(await crypto.subtle.sign("HMAC",hk,te.encode([id,pt,texte].join("|"))))].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
  const body=new URLSearchParams();body.append("entry."+FORM.ev,"FDR:"+id);body.append("entry."+FORM.pt,pt);body.append("entry."+FORM.rep,texte);body.append("entry."+FORM.src,"fdr:"+st.me.slug+":"+sg);
  try{await fetch(FORM.url,{method:"POST",mode:"no-cors",body});lsSet("fdr-prof-"+id+"-"+st.me.slug,{...v,date:new Date().toISOString().slice(0,19)});st.editProf=false;toast("Envoyé ✓");openSheet(id,true)}
  catch(e){toast("Pas pu envoyer 😕 Vérifie ta connexion.")}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-prof-send],[data-prof-edit]");if(!b)return;
  if(b.dataset.profSend){b.disabled=true;sendProf(b.dataset.profSend).finally(()=>{b.disabled=false})}
  else{st.editProf=true;openSheet(b.dataset.profEdit,true)}});
async function saveRem(id){
  const t=document.getElementById("remtxt").value.trim();if(!t||!st.db)return;
  try{await st.db.collection("remarques").add({event:id,texte:t,date:new Date().toISOString(),statut:"nouveau"});toast("Remarque enregistrée ✓");document.getElementById("remtxt").value=""}
  catch(e){toast("Pas pu enregistrer 😕")}
}


if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
(async()=>{
  render();
  let raw=null;try{const s=localStorage.getItem(LS);if(s)raw=b64d(s)}catch(e){}
  if(raw&&await unlockWith(raw,false))render();
  try{
    if(window.claude&&claude.use){
      const db=await claude.use("db");
      if(db){
        const snap=await db.doc("prive/cle").get().catch(()=>null);
        if(snap&&snap.exists){st.db=db;await unlockWith(b64d(snap.data().k),true);render();
          db.collection("remarques").onSnapshot(q=>{st.rem=q.docs.map(d=>d.data());if(curOpen&&curOpen!=="__memo")openSheet(curOpen,true)},()=>{});
        }
      }
    }
  }catch(e){}
})();
