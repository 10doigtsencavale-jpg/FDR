<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:"Fredoka",system-ui,sans-serif;font-weight:600;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}
.top{background:var(--hero);color:var(--hero-fg);padding:22px 18px 20px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;gap:10px}

.login{display:flex;flex-direction:column;gap:8px}

.month{font-family:"Fredoka";font-weight:600;font-size:19px;margin:22px 16px 8px;color:var(--muted);text-transform:capitalize}
.ev{display:flex;gap:12px;align-items:center;margin:8px 14px;background:var(--card);border-radius:18px;padding:12px;box-shadow:0 4px 14px rgba(29,32,51,.06);border:0;width:calc(100% - 28px);text-align:left}
.ev.mine{outline:3px solid var(--ok)}

.b-ok{background:var(--ok-soft);color:var(--ok)}.b-a_faire{background:var(--todo-soft);color:var(--todo)}.b-a_verifier{background:var(--chk-soft);color:var(--chk)}.b-orga{background:var(--blue-soft);color:var(--blue)}

.det{color:var(--muted);font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--fg);color:var(--bg);border:0;border-radius:12px;padding:11px;font-weight:700;font-size:16px;margin-top:6px;text-decoration:none;width:100%}

.num{user-select:text;-webkit-user-select:text}

ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}

.note{color:var(--muted);font-size:15px}
.rem{background:var(--bg);border-radius:12px;padding:10px 12px}

.lockmsg{margin:40px 20px;text-align:center;font-size:19px}

.cat{margin:10px 14px 0;border-radius:18px;overflow:hidden;background:transparent;scroll-margin-top:60px}.cat[open]{background:var(--s)}
.cat>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 14px;color:var(--c);background:var(--s);border:3px solid var(--b,var(--s));border-radius:18px;cursor:pointer}

.cat>summary .t small{display:block;opacity:.93;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.jrow{display:grid;grid-template-columns:64px minmax(0,1fr);column-gap:10px;border-radius:16px;padding:12px;color:#1d2033}
.jrow.kt{background:#e3e5f7}.jrow.kp{background:#fde7c2}.jrow.ki{background:#dff2ee}.jrow.kp.star{background:#f7a42b}
.jh{font-family:"Fredoka";font-weight:700;font-size:21px;line-height:1.15}.kt .jh,.kt .jtag{color:#2e3bb2}.kp .jh,.kp .jtag{color:#7a4700}.ki .jh,.ki .jtag{color:#1f5a50}.kp.star .jh,.kp.star .jtag{color:#1d2033}
.jtag{font-size:12.5px;font-weight:700;letter-spacing:.04em}.jti{font-weight:700}.star .jti{font-size:20px}.js{font-size:15.5px}

.jb{display:inline-block;margin-top:6px;border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:15px;text-decoration:none;background:#fff;color:#2e3bb2;cursor:pointer}.jb.dark{background:#2e3bb2;color:#fff}

.jprat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:6px}.jprat .jb{margin:0;text-align:center;padding:12px 8px;background:var(--bg);color:var(--fg);font-size:16px}.jprat .jb small{display:block;font-weight:400;font-size:14px;color:var(--muted)}.jprat .jb.call{background:#1f6b5e;color:#fff}.jprat .jb.call small{color:#e6f4f1}
.dchips{display:flex;gap:6px}.dchips button{flex:1;border:0;border-radius:999px;padding:7px 4px;font-weight:700;font-size:14.5px;white-space:nowrap;background:var(--bg);color:var(--fg)}.dchips button.j{background:#f9c2b4;color:#1d2033}
.dcard{border-radius:20px;overflow:hidden;background:var(--card);border:2px solid var(--line);scroll-margin-top:60px}.dcard.j{border:3px solid #cdd1f3}

.dhead h3{margin:0;font-family:"Fredoka";font-weight:600;font-size:20px}.dhead small{font-weight:700;font-size:13.5px;color:#2e3bb2}
.dbody{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px}
.dlab{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:4px}.dlab.gv{color:#4b57d6}.dlab.gs{color:#b06a00}.dlab.gd{color:#2a8a78}
.drow{display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:10px}.dh{font-family:"Fredoka";font-weight:700;font-size:19px;line-height:1.2}

.dbtns{display:flex;flex-wrap:wrap;gap:6px}
.dgrp{border-radius:14px;background:var(--gb)}.dgrp.gv{--gb:#f1f2fc;--gc:#2e3bb2}.dgrp.gs{--gb:#fef1ec;--gc:#b3311f}.dgrp.gd{--gb:#eef7f4;--gc:#1f6b5e}
.dgrp>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:8px;padding:10px 12px;cursor:pointer;color:var(--gc)}.dgrp>summary::-webkit-details-marker{display:none}.dgrp>summary::before{content:none!important}

.dgb{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px;color:#1d2033}.dgrp .dnuit{background:#fff}.dgrp .drow.star{margin:0 -4px}

.ev{border-left:10px solid var(--cc,transparent)}

<div class="wrap" id="app"></div>

const PHOTOS={};
const LS="10dec_cle";
const te=new TextEncoder(),td=new TextDecoder();
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64e=u=>{let s="";u.forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const st={me:null,admin:false,keys:{},ev:{},memo:null,rem:[],db:null,tk:null,pk:null,pkRaw:null,ak:null,pf:{},pa:{}};let NOMS={};
let curOpen=null;

async function imp(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])}
async function dec(key,bytes){try{return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes.slice(0,12)},key,bytes.slice(12)))}catch(e){return null}}
async function derive(code){
  const base=await crypto.subtle.importKey("raw",te.encode(code),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64d(DATA.salt),iterations:DATA.iter,hash:"SHA-256"},base,256));
}
async function unlockWith(raw,isAdmin){
  const k=await imp(raw);let who=null;
  if(!isAdmin){for(const p of DATA.persons){const r=await dec(k,b64d(p));if(r){who=JSON.parse(td.decode(r));break}}if(!who)return false;st.me=who;st.pk=k;st.pkRaw=raw;
    if(who.adm){const a=await dec(k,b64d(who.adm));if(a)await unlockWith(a,true)}}
  else{st.admin=true;st.ak=k}
  if(!st.tk)for(const w of DATA.team.wraps){const r=await dec(k,b64d(w));if(r){const tk=await imp(r);st.tk=tk;st.memo=JSON.parse(td.decode(await dec(tk,b64d(DATA.team.data))));NOMS=JSON.parse(td.decode(await dec(tk,b64d(DATA.team.noms))));break}}
  for(const e of DATA.events){if(e.id)continue;let r=st.tk?await dec(st.tk,b64d(e.h)):null;if(!r&&isAdmin)r=await dec(k,b64d(e.h));if(r)Object.assign(e,JSON.parse(td.decode(r)))}
  for(const e of DATA.events){if(!e.id||st.ev[e.id])continue;for(const w of e.wraps){const r=await dec(k,b64d(w));if(r){const ek=await imp(r);st.keys[e.id]=ek;st.ev[e.id]=JSON.parse(td.decode(await dec(ek,b64d(e.data))));break}}}
  /* Régime et tailles : la personne lit seulement la sienne, Aurélie et Périnne lisent tout. */
  for(const e of DATA.events){if(!e.id)continue;
    if(!isAdmin&&e.pf&&!st.pf[e.id])for(const x of e.pf){const r=await dec(k,b64d(x));if(r){const o=JSON.parse(td.decode(r));if(o.ev===e.id){st.pf[e.id]=o;break}}}
    if(isAdmin&&e.pa&&!st.pa[e.id]){const r=await dec(k,b64d(e.pa));if(r)st.pa[e.id]=JSON.parse(td.decode(r))}}
  return true;
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function face(slug){return `<span class="nm${st.me&&st.me.slug===slug?" me":""}">${esc(NOMS[slug]||slug)}</span>`}
const CAT={interpretation:"Interprétation",ateliers:"Atelier",festivals:"Festival",prod:"Prod artiste",projets:"Projet spécial",salles:"Salle",tb:"Team building"};
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS=["dim","lun","mar","mer","jeu","ven","sam"];
function dd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function longDate(e){const a=dd(e.date),b=dd(e.fin);const f=x=>`${JOURS[x.getDay()]} ${x.getDate()} ${MOIS[x.getMonth()]}`;return e.fin&&e.fin!==e.date?`${f(a)} → ${f(b)}`:f(a)}

function render(){
  const app=document.getElementById("app");
  let h=`<header class="top"><h1>🤟 10DEC - FDR</h1>`;
  if(st.me||st.admin){
    h+=`<div class="hi">Bonjour ${esc(st.me?st.me.nom:"l'équipe admin")} 👋</div>`;
    if(st.me)h+=`<button class="small-btn" id="logout">Changer de code</button>`;
  }else{
    h+=`<div class="login"><label for="code">🔑 Ton code personnel</label><div class="row"><input id="code" type="password" autocomplete="current-password" enterkeyhint="go"><button id="go">OK</button></div><div class="err" id="err"></div><div class="note">Ton téléphone s'en souviendra.</div></div>`;
  }
  h+=`</header>`;
  if(st.me||st.admin)h+=`<div class="legend">${Object.entries(CAT).filter(([k])=>k!=="tb"||st.admin).map(([k,v])=>`<span class="cat-${k}">${v}</span>`).join("")}</div>`;
  if(st.memo)h+=`<button class="memo-btn" id="memo">📋 Mémo 10 Doigts (tenue, attitude, interviews)</button>`;
  let last="";
  const evs=DATA.events.filter(e=>e.id).sort((a,b)=>a.date.localeCompare(b.date));
  if(!evs.length&&(st.me||st.admin))h+=`<p class="empty">Aucun événement pour l'instant.</p>`;
  for(const e of evs){
    if(e.a&&!st.admin)continue;
    const d=dd(e.date);const mk=`${MOIS[d.getMonth()]} ${d.getFullYear()}`;
    if(mk!==last){h+=`<h3 class="month">${mk}</h3>`;last=mk}
    const p=st.ev[e.id];const mine=st.me&&e.qui.includes(st.me.slug);
    h+=`<button class="ev ${p?"":"locked"} ${mine?"mine":""} cat-${e.c||"x"}" data-id="${e.id}"><span class="d"><span>${JOURS[d.getDay()]}</span><b>${d.getDate()}</b><span>${MOIS[d.getMonth()].slice(0,4)}</span></span><span class="m">${CAT[e.c]?`<span class="catchip">${CAT[e.c]}</span>`:""}`;
    h+=p?`<span class="t">${esc(p.titre)}</span><span class="v">📍 ${esc(p.ville)} · ${esc(p.type)}</span>`:`<span class="t">🔒 Événement</span>`;
    h+=`<span class="faces">${e.qui.map(face).join("")}</span>${mine?`<span class="tag">✓ Tu y es</span>`:""}</span></button>`;
  }
  app.innerHTML=h;
  const go=document.getElementById("go");
  if(go){const inp=document.getElementById("code");
    const tryCode=async()=>{const c=inp.value.trim();if(!c)return;go.disabled=true;document.getElementById("err").textContent="Je vérifie…";
      const raw=await derive(c);
      if(await unlockWith(raw,false)){try{localStorage.setItem(LS,b64e(raw))}catch(e){}render()}
      else{document.getElementById("err").textContent="Code inconnu. Vérifie les majuscules.";go.disabled=false}};
    go.onclick=tryCode;inp.onkeydown=e=>{if(e.key==="Enter")tryCode()}}
  const lo=document.getElementById("logout");if(lo)lo.onclick=()=>{try{localStorage.removeItem(LS)}catch(e){}location.reload()};
  const mb=document.getElementById("memo");if(mb)mb.onclick=()=>openSheet("__memo");
  app.querySelectorAll(".ev").forEach(b=>b.onclick=()=>{const id=b.dataset.id;if(!st.ev[id]){toast(st.me||st.admin?"🔒 Ce n'est pas ton événement.":"Entre ton code d'abord 🔑");return}openSheet(id)});
}

function legHTML(l,e){
  const lab=l.badge||{ok:"✓ Réservé",a_faire:"Résa à faire",a_verifier:"À vérifier",orga:"Pris en charge"}[l.etat]||"";
  const ic=l.sens==="Aller"?"➡️":l.sens==="Retour"?"⬅️":"🛏️";
  let h=`<div class="leg ${l.etat}"><div class="leg-top"><span class="k">${ic} ${esc(l.sens)} · ${esc(l.date)}</span><span class="badge b-${l.etat}">${lab}</span></div><div class="leg-body">`;
  if(l.dep||l.arr)h+=`<div class="big">${esc(l.dep||"?")} → ${esc(l.arr||"?")}</div>`;
  if(l.de)h+=`<div class="route">${esc(l.de)} → ${esc(l.vers||"?")}</div>`;
  if(l.detail)h+=`<div class="det">${telify(l.detail)}</div>`;
  for(const id of l.billets||[]){const b=e.billets[id];if(b)h+=`<button class="btn" data-billet="${id}">🎫 ${esc(b.t)}</button>`}
  if(!(l.billets||[]).length&&!l.sansbillet)h+=`<div class="miss">🎫 Billet pas encore dans le Drive</div>`;
  return h+`</div></div>`;
}
function telNorm(n){let d=n.replace(/[^0-9+]/g,"");if(d.startsWith("+336")||d.startsWith("+337")||d.startsWith("+33"))d="+33"+d.slice(3);return d}
function telA(n){const pretty=n.replace(/^\+33\s?/,"0").replace(/[.\s]/g,"").replace(/^(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})$/,"$1 $2 $3 $4 $5");return `<a class="tel" href="tel:${telNorm(n)}">📞 <span class="num">${esc(pretty)}</span></a>`}
function telify0(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b class="code">$1</b>').replace(/(\+33\s?\d[\d .]{7,}\d|0\d(?:[ .]?\d{2}){4})/g,m=>`<a class="tlink num" href="tel:${telNorm(m)}">${m}</a>`)}
function telify(t){return String(t||"").split(/(https?:\/\/[^\s]+)/).map((p,i)=>i%2?`<a class="btn light" href="${esc(p)}" target="_blank" rel="noopener">${/google\.[a-z.]+\/maps|maps\.app\.goo\.gl|goo\.gl\/maps/.test(p)?"🗺️ Voir le trajet":"🔗 Ouvrir le lien"}</a>`:telify0(p)).join("")}
const PCOL={"périnne":["#fff2cc","#7a5c00"],"eddy":["#d9ead3","#2f6b1f"],"théo":["#cfe2f3","#1f4e79"],"theo":["#cfe2f3","#1f4e79"],"christelle":["#f4cccc","#8a1c1c"],"célia":["#fce5cd","#8a4b08"],"aurélie":["#ead1dc","#741b47"],"jen":["#d0e0e3","#134f5c"],"helen":["#d9d2e9","#351c75"],"julianne":["#c9daf8","#1c4587"],"artur":["#e6b8af","#85200c"]};
function pillStyle(q){const k=q.toLowerCase().trim();if(k.includes("+")||k.includes("4 mains"))return "background:#ffd6f5;color:#8a0070";for(const n in PCOL){if(k.startsWith(n)){const c=PCOL[n];return `background:${c[0]};color:${c[1]}`}}return ""}
function persStyle(w){const k=w.toLowerCase();if(k.includes("+"))return "background:#ffeefa;border-color:#f3b6e4";for(const n in PCOL){if(k.startsWith(n)){const c=PCOL[n];return `background:${c[0]}66;border-color:${c[0]}`}}return ""}
function sec(id,title,body,cls=""){return body?`<section class="sec ${cls}" id="s-${id}"><h2>${title}</h2>${body}</section>`:""}
const CATS={run:"run",dodo:"dodo",contacts:"cont",acces:"acc",setlist:"set",tenue:"ten",infos:"inf"};
function strip(t){return String(t||"").replace(/\*\*/g,"")}
function cut(t,n){t=strip(t);return t.length>n?t.slice(0,n-1)+"…":t}
function cat(id,title,body,sum){if(!body)return "";const ic=title.split(" ")[0],t=title.slice(ic.length+1);
  return `<details class="cat k-${CATS[id]}" id="s-${id}"><summary><span class="e">${ic}</span><span class="t"><b>${esc(t)}</b>${sum?`<small>${esc(sum)}</small>`:""}</span><span class="ch">›</span></summary><div class="cbody">${body}</div></details>`}
function isConf(e){return !!e.habille||e.cat==="interpretation"||/conf|table ronde|rencontre|colloque/i.test(e.type||"")}
const isPub=r=>/^(🚌|🚇|🚊|🚍|🚆|🚶|⛴)/u.test(r.ic||"");
function sums(e){const pl=(n,w)=>n+" "+w+(n>1?"s":"");const run=Array.isArray(e.run)?e.run:[];const hb=e.hebergement||{};const dep=(hb.items||[]).find(x=>/départ/i.test(x.b));const ac=(e.acces||{}).items||[];
  return {run:run.length?(()=>{const a=run.filter(isPub).length,r=run.length-a;return [a?(a>1?a+" transports autonomes":"1 transport autonome"):"",r?pl(r,"run"):""].filter(Boolean).join(" · ")})():"",
   dodo:hb.nom?cut(hb.nom+(dep?" · départ "+dep.t.replace(/\.$/,""):""),46):"",
   contacts:pl((e.contacts||[]).length,"contact"),
   acces:ac.length?cut(ac.slice(0,2).map(x=>x.t.replace(/\.$/,"")).join(" · "),46):"",
   setlist:pl(e.setlist.length,"titre"),
   tenue:isConf(e)?"Tenue habillée noire ou sombre":"Tee-shirt + pull 10 DEC · tenue concert",
   infos:pl((e.remarques||[]).length,"info")}}

function tmin(x){const s=String(x||"").toLowerCase();const m=s.match(/(\d{1,2})\s*h\s*(\d{0,2})/);if(m)return (+m[1])*60+(+(m[2]||0));
  if(/apr[eè]s-midi|aprem/.test(s))return 840;if(/matin/.test(s))return 480;if(/midi/.test(s))return 720;if(/journ/.test(s))return 600;
  if(/soir|d[iî]ner/.test(s))return 1140;if(/apr[eè]s|fin|retour/.test(s))return 1400;if(/nuit/.test(s))return 1430;return null}
function dnum(x){const m=String(x||"").match(/\b(\d{1,2})(?:\/\d{1,2})?\b/);return m?+m[1]:null}
function kindOf(x){const s=String(x||"").toLowerCase();return /balance|concert|spectacle|chansign|show|atelier|conf[ée]rence|table ronde|line ?check|speech|r[ée]p[ée]t|filage|captation|tournage|interview|lecture|pl[ée]ni[èe]re|prestation|soundcheck/.test(s)?"p":"i"}
function daysHTML(e,pub){
  const ev=new Date(pub.date+"T12:00:00"),evD=ev.getDate();
  const off=d=>{if(d==null)return 0;let o=d-evD;if(o<-20)o+=31;if(o>20)o-=31;return o};
  const it=[];const hb=e.hebergement||{};
  let T=e.trajets||[];const me=st.me&&st.me.nom?st.me.nom.toLowerCase():"";
  const mine=me?T.filter(l=>String(l.qui).toLowerCase().includes(me)):[];if(mine.length)T=mine;
  const team=new Set((e.trajets||[]).map(l=>l.qui)).size;
  // trajets identiques fusionnés (plusieurs personnes, même train)
  const G={};for(const l of T){const ret=l.sens==="Retour";const k=[l.date,l.dep,l.arr,l.de,l.vers].join("|");(G[k]=G[k]||{l,ret,qui:[],b:[]}).qui.push(l.qui);for(const id of l.billets||[])if(e.billets&&e.billets[id])G[k].b.push([l.qui,id])}
  let arrAller=null;const tday={};
  for(const k in G){const g=G[k],l=g.l;const o=off(dnum(l.date)??(g.ret?evD+1:evD));const m=tmin(l.dep)??(g.ret?1439:300);
    (tday[o]=tday[o]||new Set());g.qui.forEach(q=>tday[o].add(q));
    if(!g.ret&&o===0){const a=tmin(l.arr);if(a!=null)arrAller=Math.max(arrAller??0,a)}
    const txt=(l.de+" "+l.vers+" "+(l.detail||"")).toLowerCase();const mode=/vol |avion|a[ée]roport|orly|cdg|roissy/.test(txt)?"Avion":l.sansbillet?"Trajet":"Train";
    const sub=[];if(l.arr)sub.push(`<b>Arrivée ${esc(l.arr)}</b>`);if(l.detail)sub.push(telify(l.detail));if(team>1&&!mine.length)sub.push(`<span class="dmut">${esc(g.qui.join(" et "))}</span>`);
    const seen=new Set();const bl=g.b.filter(x=>!seen.has(x[1])&&seen.add(x[1])).map(x=>`<button class="jb dark" data-billet="${x[1]}">${g.b.length>1&&!mine.length?"Billet "+esc(x[0]):"Billet"}</button>`).join("")||(!l.sansbillet&&l.etat!=="ok"&&l.etat!=="orga"?`<div class="jw">Billet pas encore dans l'appli</div>`:"");
    it.push({o,m,g:"v",ret:g.ret,h:l.dep||"",title:mode+" "+(l.de?esc(l.de)+" → "+esc(l.vers||"?"):esc(l.sens)),sub,x:bl?`<div class="dbtns">${bl}</div>`:""})}
  for(const r of (Array.isArray(e.run)?e.run:[])){const pubT=isPub(r);const lab=String(r.b||"");const o=off(dnum(lab)??evD);
    let m=tmin(lab.replace(/^\S+\s+\d{1,2}\/\d{1,2}\s*·?\s*/,""));const s=lab.toLowerCase();
    if(m==null)m=(/apr[eè]s|retour|soir|fin|nuit|h[ôo]tel/.test(s)&&!/gare\s*→/.test(s))?1400:(arrAller!=null?arrAller+1:500);
    it.push({o,m,g:"v",h:"",title:esc(lab.replace(/^\S+\s+\d{1,2}\/\d{1,2}\s*·\s*/,"")),tag:pubT?"Tu y vas seul(e)":"Run : l'orga t'emmène",sub:(r.l||[]).map(x=>telify(x)),x:""})}
  let prev=-1;for(const p of (e.planning||[])){const hh=String(p.heure||"");const dd=/^(lun|mar|mer|jeu|ven|sam|dim)/i.test(hh)?dnum(hh):null;const o=off(dd??evD);
    if(/arriv[\wéè]*\s+(en|à la)\s+gare|^train|train (retour|aller)|retour en train/i.test(p.quoi)&&tday[o])continue;
    if(/^fin\b/i.test(p.quoi)){const ls=[...it].reverse().find(x=>x.o===o&&x.star);if(ls){ls.sub.push(`<b>Fin ${esc(hh)}</b>`);continue}}
    let m=dd!=null?tmin(hh.replace(/^\S+\s*\d{1,2}\/\d{1,2}/,"")):tmin(hh);if(m==null)m=dd!=null?420:prev+1;if(o===0)prev=m;
    const k=kindOf(p.quoi+" "+(p.detail||""));const star=/concert|spectacle|table ronde|show/i.test(p.quoi)&&!/^fin\b/i.test(p.quoi);
    it.push({o,m,g:"s",k,h:dd!=null?"":hh,title:telify(p.quoi),sub:p.detail?[telify(p.detail)]:[],x:"",star})}
  const N=(hb.nuits&&hb.nuits.length)?hb.nuits:(hb.nom?[hb]:[]);
  N.forEach((n,i)=>{const its=n.items||[];const ni=its.find(x=>/nuit/i.test(x.b));const ai=its.find(x=>/arriv/i.test(x.b));
    const o=off(dnum(ni&&ni.t)??dnum(ai&&ai.t)??(evD+(i&&N.length>1?i:0)));
    const di=its.find(x=>/d[ée]part/i.test(x.b));
    const rest=its.filter(x=>x!==di).map(x=>`<b>${esc(x.b)} :</b> ${telify(x.t)}`);
    const sub=[n.adresse?esc(n.adresse):`<span class="jw">Adresse à ajouter</span>`].concat(rest);
    it.push({o,m:3000,g:"d",h:"",title:esc(n.nom||"Logement"),sub,x:(n.maps||hb.gare_maps)?`<div class="dbtns">${hb.gare_maps?`<a class="jb" href="${esc(hb.gare_maps)}" target="_blank" rel="noopener">🚉 La gare</a>`:""}${n.maps?`<a class="jb" href="${esc(n.maps)}" target="_blank" rel="noopener">🏨 Le logement</a>`:""}</div>`:"",box:true});
    if(di)it.push({o:off(dnum(di.t)??(evD+o+1)),m:-1,g:"v",h:"Matin",title:"Quitter "+esc(n.nom||"le logement"),sub:[telify(di.t)],x:""})});
  if(!it.length)return "";
  it.sort((a,b)=>a.o-b.o||a.m-b.m);
  const days=[...new Set(it.map(x=>x.o))];
  const dlab=o=>{const d=new Date(ev);d.setDate(d.getDate()+o);const s=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"short"});return s.charAt(0).toUpperCase()+s.slice(1)};
  const short=o=>{const d=new Date(ev);d.setDate(d.getDate()+o);return d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}).replace(".","")};
  let out="";
  if(days.length>1)out+=`<div class="dchips">${days.map(o=>`<button class="${o===0?"j":""}" data-go="day${o+50}">${esc(short(o))}${o===0?" · J":""}</button>`).join("")}</div>`;
  const txt=h=>String(h||"").replace(/<[^>]*>/g,"").replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim();
  for(const o of days){const X=it.filter(x=>x.o===o);
    const who=tday[o]&&team>1&&!mine.length&&tday[o].size<team?[...tday[o]].join(" et ")+(tday[o].size===1?" seul(e)":""):"";
    out+=`<div class="dcard${o===0?" j":""}" id="day${o+50}"><div class="dhead"><h3>${esc(dlab(o))}${o===0?" · Jour J":""}</h3>${who?`<small>${esc(who)}</small>`:""}</div><div class="dbody">`;
    const grp=[];let seenS=false;
    for(const x of X){const last=grp[grp.length-1];if(!last||last.g!==x.g)grp.push({g:x.g,X:[],after:seenS});grp[grp.length-1].X.push(x);if(x.g==="s")seenS=true}
    for(const G of grp){let lab,cls,hint;
      if(G.g==="v"){const ret=G.after||G.X.some(x=>x.ret);lab="Je voyage · "+(ret?"Retour":"Aller");cls="gv";
        const f=G.X.find(x=>x.h&&x.h!=="Matin")||G.X[0];hint=(f.h&&f.h!=="Matin"?f.h+" · ":"")+txt(f.title)+(G.X.length>1?" +"+(G.X.length-1):"")}
      else if(G.g==="s"){lab=o===0?"Sur place"+(e.lieu?" · "+e.lieu:""):"Infos";cls="gs";
        const st_=G.X.find(x=>x.star);const hs=G.X.map(x=>x.h).filter(h=>/\d/.test(h));hint=st_?txt(st_.title)+(st_.h?" · "+st_.h:""):(hs.length?hs[0]+(hs.length>1?" → "+hs[hs.length-1]:""):txt(G.X[0].title))}
      else{lab="Je dors";cls="gd";hint=G.X.map(x=>txt(x.title)).join(" · ")}
      out+=`<details class="dgrp ${cls}"><summary><span class="dl">${esc(lab)}</span><span class="dhint">${esc(hint)}</span><span class="ch">›</span></summary><div class="dgb">`;
      for(const x of G.X)out+=x.box?`<div class="dnuit"><div class="jti">${x.title}</div>${x.sub.map(s=>`<div class="js">${s}</div>`).join("")}${x.x}</div>`
        :`<div class="drow${x.star?" star":""}"><div class="dh">${esc(x.h)}</div><div>${x.tag?`<div class="dtag">${esc(x.tag)}</div>`:""}<div class="jti">${x.title}</div>${x.sub.map(s=>`<div class="js">${s}</div>`).join("")}${x.x}</div></div>`;
      out+=`</div></details>`}
    out+=`</div></div>`}
  const AJ=(e.trajets||[]).filter(t=>t.sens==="Aller"&&t.vers);const aj=AJ.filter(t=>off(dnum(t.date)??evD)===0).pop()||AJ.pop();
  const g=hb.gare||(aj?"Gare SNCF de "+aj.vers:"");
  const gm=hb.gare_maps||(g?"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(g):"");
  const lm="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((e.lieu||"")+" "+(e.adresse||e.ville||""));
  const btn=(href,lab)=>`<a class="jb" href="${esc(href)}" target="_blank" rel="noopener">${lab}</a>`;
  out+=`<div class="jprat">${btn(lm,`Le lieu<small>${esc(e.lieu||"")}</small>`)}${gm?btn(gm,`La gare<small>${esc(g.replace(/^Gare (SNCF )?(de |d')?/i,""))}</small>`):""}</div>`;
  return out}

function eventHTML(id){
  const e=st.ev[id],pub=DATA.events.find(x=>x.id===id);
  const navs=[];const S=[];
  const SM=sums(e);const TI=[];const TK={contacts:1,setlist:1,tenue:1,infos:1,repas:1};
  const add=(k,lab,html,cls)=>{if(!html)return;navs.push([k,lab]);if(TK[k]){TI.push([k,lab,html]);if(TI.length===1)S.push("@@TILES@@");return}S.push(CATS[k]?cat(k,lab,html,SM[k]):sec(k,lab,html,cls))};
  const rems=st.rem.filter(r=>r.event===id);
  add("chg","⚠️ Changements",(e.changements||[]).map(c=>`<div>• ${telify(c)}</div>`).join(""),"chg");
  add("journee","🗓️ Programme",daysHTML(e,pub),"journee");
  const run=Array.isArray(e.run)?e.run:[];
  let tr="";const byWho={};for(const l of e.trajets){(byWho[l.qui]=byWho[l.qui]||[]).push(l)}
  const legOrder=l=>l.sens==="Aller"?0:l.sens==="Retour"?2:1;
  for(const w in byWho){const L=byWho[w].sort((a,b)=>legOrder(a)-legOrder(b));const miss=L.some(l=>!(l.billets||[]).length&&!l.sansbillet);const worst=L.some(l=>l.etat==="a_faire")?"a_faire":(miss||L.some(l=>l.etat==="a_verifier"))?"a_verifier":"ok";
    const mine=st.me&&w.toLowerCase().includes(st.me.nom.toLowerCase());
    tr+=`<details class="pers ${worst}" style="${persStyle(w)}"><summary><span class="pn">👤 ${esc(w)}</span><span class="badge b-${worst}">${worst==="ok"?"✓ OK":worst==="a_faire"?"Résa à faire":miss?"🎫 Billet manquant":"À vérifier"}</span></summary><div class="pbody">${L.map(l=>legHTML(l,e)).join("")}</div></details>`}
  add("trajets","🚆 Trajets & billets",tr);
  const hb=e.hebergement||{};
  const a=e.acces||{};
  add("acces","🚗 Accès / accréditations",((a.items||[]).map(x=>`<div class="it"><span class="ic">${x.ic}</span><div><b class="itb">${esc(x.b)}</b><div>${telify(x.t)}</div></div></div>`).join(""))+`<a class="btn light" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.lieu+" "+e.adresse)}" target="_blank" rel="noopener">📍 Le lieu dans Maps</a>`);
  add("contacts","📞 Contacts sur place",``+(e.contacts||[]).map(c=>{const nums=(c.tel||"").split("/").map(x=>x.trim()).filter(x=>/\d{2}/.test(x)&&!/signature/i.test(x));return `<div class="contact"><div><b>${esc(c.nom)}</b><small>${esc(c.role)}</small></div><div class="tels">${nums.map(n=>telA(n)).join("")}</div></div>`}).join(""));
  add("setlist","🎵 Setlist",e.setlist.length?`${e.setlist_note?`<div class="note">${esc(e.setlist_note)}</div>`:""}<table><thead><tr><th>#</th><th>Titre</th><th>Qui</th><th></th></tr></thead><tbody>${e.setlist.map(s=>`<tr><td class="n">${s.n}</td><td class="t">${esc(s.titre)}</td><td>${s.qui?(()=>{const m=s.qui.match(/^([^(]*)(\(.*\))?/);const nm=m[1].trim();return `<span class="pill" style="${pillStyle(nm)}">${esc(nm)}</span>${m[2]?`<small class="pq">${esc(m[2].slice(1,-1))}</small>`:""}`})():""}</td><td>${s.doc?`<a class="lyr" href="${esc(s.doc)}" target="_blank" rel="noopener">Paroles ↗</a>`:""}</td></tr>`).join("")}</tbody></table>`:"");
  add("tenue","👕 Tenue",isConf(e)?`<div class="it"><span class="ic">🖤</span><div><b class="itb">Habillée</b><div>Tenue habillée. Noire ou couleur sombre.${e.tenue?" "+esc(e.tenue):""}</div></div></div>`:`<div class="it"><span class="ic">☀️</span><div><b class="itb">Journée</b><div>Tee-shirt + pull 10 DEC. Bas au choix (habillé).</div></div></div><div class="it"><span class="ic">🌙</span><div><b class="itb">Concert</b><div>Tenue de concert, raccord entre chansigneurs.${e.tenue?" "+esc(e.tenue):""}</div></div></div>`);
  const rp=repasHTML(id,pub);if(rp){SM.repas=rp.sum;add("repas","🍽️ Régime alimentaire + taille vêtement",rp.html)}
  add("infos","📝 Infos & remarques",(e.remarques||[]).map(r=>`<div class="it"><span class="ic">•</span><div>${telify(r)}</div></div>`).join(""));
  if(st.admin&&!st.db){
    add("admin","✍️ Admin",`<div class="note">Pour ajouter une remarque ou corriger une info : écris dans la fiche FDR du Drive. L'appli se met à jour toute seule chaque heure.</div>${e.fiche?`<a class="btn light" href="${esc(e.fiche)}" target="_blank" rel="noopener">📄 Ouvrir la fiche FDR (Drive)</a>`:""}`);
  }
  if(st.admin&&st.db){
    add("admin","✍️ Ajouter une remarque (admin)",`<div class="note">Elle sera ajoutée à la fiche FDR du Drive et visible par l'équipe à la prochaine mise à jour (toutes les heures).</div>${rems.map(r=>`<div class="rem">${esc(r.texte)}<small>${esc((r.date||"").slice(0,16).replace("T"," "))} · ${r.statut==="synchro"?"✓ envoyée":"⏳ en attente de mise à jour"}</small></div>`).join("")}<textarea id="remtxt" placeholder="Ex : balances décalées à 15h"></textarea><button class="btn" id="remgo">Enregistrer la remarque</button>${e.fiche?`<a class="btn light" href="${esc(e.fiche)}" target="_blank" rel="noopener">📄 Ouvrir la fiche FDR (Drive)</a>`:""}`);
  }
  const ti=TI.length?`<div class="tiles">${TI.map(([k,lab])=>{const ic=lab.split(" ")[0];return `<button class="tile t-${k}" data-tile="s-${k}"><span class="e">${ic}</span><b>${esc(k==="contacts"?"Contacts":lab.slice(ic.length+1))}</b><small>${esc(SM[k]||"")}</small></button>`}).join("")}</div>`+TI.map(([k,lab,html])=>`<details class="tpan t-${k}" id="s-${k}"><summary>${esc(lab)}<span class="x">✕</span></summary><div class="cbody">${html}</div></details>`).join(""):"";
  const Sx=S.map(x=>x==="@@TILES@@"?ti:x);
  return `<div class="hero"><button class="back" data-back>← Retour</button><span class="when">${esc(longDate(pub))}</span><h1>${esc(e.titre)}</h1><span class="where">📍 ${esc(e.lieu)} · ${esc(e.ville)}</span><div class="team">${pub.qui.map(s=>`<span>${esc(NOMS[s]||s)}</span>`).join("")}</div></div><nav class="nav">${navs.map(n=>`<button data-go="s-${n[0]}">${n[1]}</button>`).join("")}</nav>${Sx.join("")}`;
}
function memoHTML(){
  return `<div class="hero"><button class="back" data-back>← Retour</button><h1>📋 Mémo 10 Doigts</h1><span class="where">Les bases à chaque date</span></div><section class="sec" style="margin-top:14px">${st.memo.map((m,i)=>`<details ${i===0?"open":""}><summary>${esc(m.t)}</summary><ul>${m.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`).join("")}</section>`;
}
function openSheet(id,fromPop){
  curOpen=id;
  const root=document.getElementById("sheet-root");
  root.innerHTML=`<div class="sheet" id="sheet">${id==="__memo"?memoHTML():eventHTML(id)}</div>`;
  if(!fromPop){try{history.pushState({sheet:id},"")}catch(e){}}
  const sh=document.getElementById("sheet");
  sh.querySelector("[data-back]").onclick=closeSheet;
  sh.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.go);if(t){if(t.tagName==="DETAILS")t.open=true;t.scrollIntoView({behavior:"smooth",block:"start"})}});
  sh.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{const t=document.getElementById(b.dataset.tile);if(!t)return;const was=t.open;sh.querySelectorAll(".tpan").forEach(p=>p.open=false);if(!was){t.open=true;t.scrollIntoView({behavior:"smooth",block:"nearest"})}});
  sh.querySelectorAll(".tpan").forEach(p=>p.addEventListener("toggle",()=>{const b=sh.querySelector(`[data-tile="${p.id}"]`);if(b)b.classList.toggle("on",p.open)}));
  sh.querySelectorAll("[data-billet]").forEach(b=>b.onclick=()=>openBillet(id,b.dataset.billet,b));
  const rg=document.getElementById("remgo");if(rg)rg.onclick=()=>saveRem(id);
}
function removeSheet(){curOpen=null;document.getElementById("sheet-root").innerHTML=""}
function closeSheet(){if(history.state&&history.state.sheet){try{history.back();return}catch(e){}}removeSheet()}
window.addEventListener("popstate",ev=>{if(window._pdfOv){window._pdfOv.remove();window._pdfOv=null;if(ev.state&&ev.state.sheet)return}const s=ev.state&&ev.state.sheet;if(s&&(st.ev[s]||s==="__memo"))openSheet(s,true);else removeSheet()});

const pdfCache={};let pdfjsP=null;
function loadPdfjs(){if(!pdfjsP)pdfjsP=new Promise((ok,ko)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok(pdfjsLib)};s.onerror=()=>{pdfjsP=null;ko()};document.head.appendChild(s)});return pdfjsP}
async function openBillet(eid,bid,btn){
  const e=st.ev[eid],b=e.billets[bid];const old=btn.textContent;
  btn.disabled=true;btn.textContent="⏳ Ouverture…";
  try{
    let raw=pdfCache[bid];
    if(!raw){const r=await fetch(b.f);if(!r.ok)throw new Error("fichier");
      raw=await dec(st.keys[eid],b64d((await r.text()).trim()));if(!raw)throw new Error("clé");pdfCache[bid]=raw}
    const lib=await loadPdfjs();
    const doc=await lib.getDocument({data:raw.slice()}).promise;
    const ov=document.createElement("div");ov.className="sheet";ov.style.zIndex=15;ov.style.background="#2a2e44";
    ov.innerHTML=`<div style="position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:#1d2033;color:#fff;z-index:2"><b style="font-family:Fredoka;font-size:17px">🎫 ${esc(b.t)}</b><button class="back" id="pdfclose">✕ Fermer</button></div><div id="pages" style="display:flex;flex-direction:column;gap:10px;padding:10px"></div>`;
    document.body.appendChild(ov);
    try{history.pushState({sheet:curOpen,pdf:1},"")}catch(x){}
    ov.querySelector("#pdfclose").onclick=()=>{if(history.state&&history.state.pdf)history.back();else ov.remove()};
    window._pdfOv=ov;
    const W=Math.min(window.innerWidth,560)-20;
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const v0=pg.getViewport({scale:1});const sc=W/v0.width;const dpr=Math.min(window.devicePixelRatio||1,3);const v=pg.getViewport({scale:sc*dpr});
      const c=document.createElement("canvas");c.width=v.width;c.height=v.height;c.style.width=W+"px";c.style.background="#fff";c.style.borderRadius="8px";ov.querySelector("#pages").appendChild(c);
      await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise}
  }catch(err){toast("Impossible d'ouvrir le billet 😕")}
  btn.disabled=false;btn.textContent=old;
}
/* ===== Repas & tailles : saisie par chaque personne, signée avec sa clé, envoyée par le formulaire ===== */
const FORM={url:"https://docs.google.com/forms/d/e/1FAIpQLSduVfDHGsYRQjoz9kRyZXjB6o-_KfHsIu15AlCrXnDhPfM7kA/formResponse",ev:"338904261",pt:"1150754807",rep:"1563863016",src:"591334309"};
const TAILLES=["XS","S","M","L","XL","XXL","3XL"];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function repasHTML(id,pub){
  const team=(pub.qui&&pub.qui.length)?pub.qui:((st.ev[id]||{}).equipe||[]);
  const inTeam=st.me&&team.includes(st.me.slug);
  if(!inTeam&&!st.admin)return null;
  let h="",sum="";
  if(inTeam){
    const mine=st.pf[id],sent=lsGet("fdr-prof-"+id+"-"+st.me.slug),cur=(sent&&(!mine||sent.date>mine.date))?sent:mine;
    const val=(lab,v)=>`<div class="it"><span class="ic">•</span><div><b class="itb">${lab}</b><div>${esc(v||"—")}</div></div></div>`;
    if(cur&&!st.editProf){
      h+=`<div class="note">🔒 Visible seulement par toi, Aurélie et Périnne.</div>${val("Régime / allergies",cur.regime)}${val("Taille haut",cur.haut)}${val("Taille bas",cur.bas)}
        ${cur===sent&&(!mine||sent.date>mine.date)?`<div class="note">✓ Envoyé. Ajouté à la fiche à la prochaine mise à jour.</div>`:""}
        <button class="btn light" data-prof-edit="${id}">✏️ Modifier</button>`;
      sum="✓ Rempli";
    }else{
      const p=cur||st.me.prof||{};const pre=!cur&&st.me.prof;
      h+=`<div class="note">🔒 Visible seulement par toi, Aurélie et Périnne.${pre?"<br>Tes réponses d'avant. Vérifie.":""}</div>
        <label class="itb" for="pr-reg">🍽️ Régime alimentaire / allergies</label><input class="pin" id="pr-reg" value="${esc(p.regime||"")}" placeholder="ex. végétarien, sans gluten, aucun">
        <label class="itb" for="pr-haut">👕 Taille haut</label><select class="pin" id="pr-haut"><option value="">—</option>${TAILLES.map(t=>`<option${p.haut===t?" selected":""}>${t}</option>`).join("")}</select>
        <label class="itb" for="pr-bas">👖 Taille bas</label><input class="pin" id="pr-bas" value="${esc(p.bas||"")}" placeholder="ex. 38 ou M">
        <div class="pbtns">${pre?`<button class="btn" data-prof-send="${id}">✓ C'est toujours bon</button>`:`<button class="btn" data-prof-send="${id}">Envoyer</button>`}</div>`;
      sum="À compléter";
    }
  }
  if(st.admin){
    const all=st.pa[id]||{};
    h+=`${inTeam?"<hr>":""}<div class="note">Vue admin · toute l'équipe de la date.</div><table><thead><tr><th>Nom</th><th>Régime</th><th>Haut</th><th>Bas</th></tr></thead><tbody>${team.map(s=>{const v=all[s];return `<tr><td>${esc(NOMS[s]||s)}</td><td>${v?esc(v.regime||"—"):"<i>pas encore</i>"}</td><td>${v?esc(v.haut||"—"):""}</td><td>${v?esc(v.bas||"—"):""}</td></tr>`}).join("")}</tbody></table>`;
    if(!inTeam){const n=team.filter(s=>all[s]).length;sum=n+"/"+team.length}
  }
  return {html:h,sum};
}
async function sendProf(id){
  const v={regime:document.getElementById("pr-reg").value.trim(),haut:document.getElementById("pr-haut").value,bas:document.getElementById("pr-bas").value.trim()};
  if(!v.regime&&!v.haut&&!v.bas){toast("Remplis au moins une case 🙂");return}
  if(!v.regime)v.regime="Aucun";
  const pt="profil:"+st.me.slug,texte=JSON.stringify(v);
  const hk=await crypto.subtle.importKey("raw",st.pkRaw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
  const sg=[...new Uint8Array(await crypto.subtle.sign("HMAC",hk,te.encode([id,pt,texte].join("|"))))].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,16);
  const body=new URLSearchParams();body.append("entry."+FORM.ev,"FDR:"+id);body.append("entry."+FORM.pt,pt);body.append("entry."+FORM.rep,texte);body.append("entry."+FORM.src,"fdr:"+st.me.slug+":"+sg);
  try{await fetch(FORM.url,{method:"POST",mode:"no-cors",body});lsSet("fdr-prof-"+id+"-"+st.me.slug,{...v,date:new Date().toISOString().slice(0,19)});st.editProf=false;toast("Envoyé ✓");openSheet(id,true)}
  catch(e){toast("Pas pu envoyer 😕 Vérifie ta connexion.")}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-prof-send],[data-prof-edit]");if(!b)return;
  if(b.dataset.profSend){b.disabled=true;sendProf(b.dataset.profSend).finally(()=>{b.disabled=false})}
  else{st.editProf=true;openSheet(b.dataset.profEdit,true)}});
async function saveRem(id){
  const t=document.getElementById("remtxt").value.trim();if(!t||!st.db)return;
  try{await st.db.collection("remarques").add({event:id,texte:t,date:new Date().toISOString(),statut:"nouveau"});toast("Remarque enregistrée ✓");document.getElementById("remtxt").value=""}
  catch(e){toast("Pas pu enregistrer 😕")}
}


if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
(async()=>{
  render();
  let raw=null;try{const s=localStorage.getItem(LS);if(s)raw=b64d(s)}catch(e){}
  if(raw&&await unlockWith(raw,false))render();
  try{
    if(window.claude&&claude.use){
      const db=await claude.use("db");
      if(db){
        const snap=await db.doc("prive/cle").get().catch(()=>null);

          db.collection("remarques").onSnapshot(q=>{st.rem=q.docs.map(d=>d.data());if(curOpen&&curOpen!=="__memo")openSheet(curOpen,true)},()=>{});
        }
      }
    }
  }catch(e){}
})();
